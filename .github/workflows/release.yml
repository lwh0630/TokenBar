name: Release

# Builds signed Android APKs (one per ABI), Windows x64 and arm64 zips, a Linux x64
# tarball, macOS arm64 and x86_64 disk images and an unsigned iOS IPA, and creates a
# DRAFT GitHub Release. Nothing is published automatically: review the draft,
# then publish it by hand. (TokenBar's in-app update check only sees published,
# non-draft, non-pre-release releases.)
#
#  - Automatic: push a version tag such as `v1.0.0`.
#  - Manual:    "Actions" tab -> "Release" -> "Run workflow", enter a version
#               such as `v1.0.0`. The tag is created when the draft is
#               published, on the commit the workflow ran from.
#
# Signing (Android):
#  - The release keystore and passwords live ONLY in the `production` GitHub
#    Environment secrets (ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD,
#    ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS) and are used only by the
#    `android` job.
#  - This workflow has no pull_request trigger, so untrusted PRs never get them.
#    The `production` environment is restricted to the `main` branch and `v*`
#    tags (Settings -> Environments -> production -> Deployment branches and tags).
#  - Gradle refuses to build a release without signing material; there is no
#    fallback to the debug key (android/app/build.gradle.kts).
on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0 or v1.0.0-beta.1)"
        required: true
        type: string

# Least privilege by default; only the publish job gets write access.
permissions:
  contents: read

# Never run two releases for the same version at once, and never cancel one
# that is already publishing.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  # Keep these in sync with ci.yml and AGENTS.md.
  FLUTTER_VERSION: "3.47.7"
  # Commit of the Flutter 3.47.7 tag; used to build the Windows arm64 SDK from source.
  FLUTTER_COMMIT: "abaf9c523780a608bd46686fd5e53740a07077f8"
  JAVA_VERSION: "17"
  # SHA-256 fingerprint of the release signing certificate (public information).
  # Every APK must be signed with exactly this certificate. Changing it is a
  # signing-key rotation and breaks in-place upgrades: review it carefully.
  EXPECTED_CERT_SHA256: "c04373ec39a24dd04d6f6797ed984be27d172c01fc30833f957845bb5b622d27"

jobs:
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - name: Resolve and validate the version
        id: version
        env:
          # Passed through env (not interpolated into the script) to avoid
          # shell injection through the manual input.
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_VERSION"
          else
            tag="$REF_NAME"
          fi

          # vMAJOR.MINOR.PATCH with an optional pre-release suffix.
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid version::'$tag' must look like v1.0.0 or v1.0.0-beta.1"
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "name=${tag#v}"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Build signed Android APKs
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Gives this job (and only this job) access to the environment secrets.
    environment: production

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        # Third-party action: pinned to a full commit SHA (tag v2.23.0).
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      # Secrets are exposed only to the steps below that list them in `env`.
      # The keystore is written outside the workspace and deleted at the end.
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret::$name is not set in the 'production' environment."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          keystore="$RUNNER_TEMP/tokenbar-release.jks"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      # build-name comes from the tag. build-number (Android versionCode) must
      # grow with every release so that newer APKs can update older ones; the
      # workflow run number is monotonic. Flutter adds the per-ABI offset.
      - name: Build signed release APKs (split per ABI)
        env:
          BUILD_NAME: ${{ needs.version.outputs.name }}
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER"

      - name: Verify APK signatures
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          echo "Using $apksigner"

          expected="${EXPECTED_CERT_SHA256,,}"
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/app-*-release.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error title=No APKs::No release APKs were produced."
            exit 1
          fi

          for apk in "${apks[@]}"; do
            report="$("$apksigner" verify --verbose --print-certs "$apk")"

            signers="$(grep -c 'certificate SHA-256 digest:' <<< "$report" || true)"
            actual="$(grep 'certificate SHA-256 digest:' <<< "$report" | awk '{print tolower($NF)}' | sort -u)"

            if [ "$signers" -lt 1 ] || [ "$actual" != "$expected" ]; then
              echo "::error title=Signature mismatch::$apk is not signed by the expected release certificate."
              echo "expected: $expected"
              echo "actual:   $actual"
              exit 1
            fi
            echo "OK  $apk  (cert SHA-256 $actual)"
          done

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/tokenbar-release.jks"

      - name: Collect APKs
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p dist
          shopt -s nullglob
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="${apk##*/app-}"
            abi="${abi%-release.apk}"
            cp "$apk" "dist/tokenbar-${TAG}-android-${abi}.apk"
          done
          if [ -z "$(ls -A dist)" ]; then
            echo "::error title=No APKs::No release APKs were produced."
            exit 1
          fi
          ls -l dist

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: tokenbar-android
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Build Windows ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    # No signing secrets here.
    strategy:
      # Flutter cannot cross-compile Windows, so each architecture is built
      # natively on its own runner.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Flutter publishes no arm64 Windows SDK archive, so on the ARM runner the
      # tagged source is cloned; its first run downloads the arm64 Dart SDK and the
      # tool then builds a native arm64 app.
      - name: Set up Flutter ${{ env.FLUTTER_VERSION }} (arm64, from source)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --depth 1 --branch $env:FLUTTER_VERSION --single-branch https://github.com/flutter/flutter.git $sdk
          $sha = git -C $sdk rev-parse HEAD
          if ($sha -ne $env:FLUTTER_COMMIT) { throw "Flutter $env:FLUTTER_VERSION resolved to $sha, expected $env:FLUTTER_COMMIT" }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $sdk 'bin')

      - name: Show the Flutter host
        shell: pwsh
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows (release)
        env:
          BUILD_NAME: ${{ needs.version.outputs.name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: flutter build windows --release --build-name="$env:BUILD_NAME" --build-number="$env:BUILD_NUMBER"

      # Verifies the exe's machine type, bundles the Visual C++ runtime, builds the
      # Inno Setup installer and smoke-tests a silent install and uninstall.
      - name: Build the installer
        env:
          TAG: ${{ needs.version.outputs.tag }}
          BUILD_NAME: ${{ needs.version.outputs.name }}
          ARCH: ${{ matrix.arch }}
        shell: pwsh
        run: |
          ./tool/build_windows_installer.ps1 -Arch $env:ARCH -Version $env:BUILD_NAME `
            -OutputName "tokenbar-$env:TAG-windows-$env:ARCH-setup" -OutputDir dist
          Get-ChildItem dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: tokenbar-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Build Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    # No signing secrets here.
    strategy:
      # Flutter cannot cross-compile Linux either, so each architecture is built
      # natively on its own runner.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            # tray_manager 0.5.x treats new Ayatana deprecations as errors on 26.04.
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system packages
        # GTK for the shell, libsecret for flutter_secure_storage, appindicator for the tray.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libayatana-appindicator3-dev

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Flutter publishes no arm64 Linux SDK archive, so on the ARM runner the
      # tagged source is cloned; its first run downloads the arm64 Dart SDK.
      - name: Set up Flutter ${{ env.FLUTTER_VERSION }} (arm64, from source)
        if: matrix.arch == 'arm64'
        run: |
          sdk="$RUNNER_TEMP/flutter"
          git clone --depth 1 --branch "$FLUTTER_VERSION" --single-branch https://github.com/flutter/flutter.git "$sdk"
          sha="$(git -C "$sdk" rev-parse HEAD)"
          if [ "$sha" != "$FLUTTER_COMMIT" ]; then
            echo "::error::Flutter $FLUTTER_VERSION resolved to $sha, expected $FLUTTER_COMMIT"
            exit 1
          fi
          echo "$sdk/bin" >> "$GITHUB_PATH"

      - name: Show the Flutter host
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux (release)
        env:
          BUILD_NAME: ${{ needs.version.outputs.name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: flutter build linux --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Package the bundle
        env:
          TAG: ${{ needs.version.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bundle="build/linux/$ARCH/release/bundle"
          test -x "$bundle/token_bar"
          # The binary must really be for this architecture.
          kind="$(file -b "$bundle/token_bar")"
          echo "$kind"
          case "$ARCH" in
            x64)   grep -q 'x86-64' <<< "$kind" ;;
            arm64) grep -q 'ARM aarch64' <<< "$kind" ;;
          esac

          dir="tokenbar-${TAG}-linux-${ARCH}"
          mkdir -p dist stage
          cp -r "$bundle" "stage/$dir"
          tar -C stage -czf "dist/$dir.tar.gz" "$dir"
          ls -l dist

      - name: Upload Linux archive
        uses: actions/upload-artifact@v7
        with:
          name: tokenbar-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  macos:
    name: Build macOS (arm64 and x86_64)
    needs: version
    runs-on: macos-latest
    timeout-minutes: 50
    # No signing secrets here. There is no Apple Developer account behind this
    # project, so the app is only ad-hoc signed and not notarized.

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS (release)
        env:
          BUILD_NAME: ${{ needs.version.outputs.name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: flutter build macos --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Check the universal app bundle
        run: |
          app="build/macos/Build/Products/Release/TokenBar.app"
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          archs="$(lipo -archs "$app/Contents/MacOS/TokenBar")"
          echo "Built architectures: $archs"
          # Flutter builds a universal binary; the per-architecture disk images
          # below are thinned from it.
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]

      # Flutter always builds universal binaries, so each architecture-specific
      # app is made by thinning every fat Mach-O file in a copy of the bundle and
      # then re-signing it ad hoc (Apple Silicon refuses unsigned code, and thinning
      # invalidates the existing signature).
      - name: Create per-architecture disk images
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          src="build/macos/Build/Products/Release/TokenBar.app"
          mkdir -p dist

          for arch in arm64 x86_64; do
            stage="stage-$arch"
            rm -rf "$stage"
            mkdir -p "$stage"
            ditto "$src" "$stage/TokenBar.app"

            while IFS= read -r -d '' f; do
              if lipo -archs "$f" 2>/dev/null | grep -q ' '; then
                lipo "$f" -thin "$arch" -output "$f.thin"
                cat "$f.thin" > "$f" # keep the file mode
                rm "$f.thin"
              fi
            done < <(find "$stage/TokenBar.app" -type f -print0)

            codesign --force --deep --sign - \
              --entitlements macos/Runner/Release.entitlements \
              "$stage/TokenBar.app"
            codesign --verify --deep --strict --verbose=2 "$stage/TokenBar.app"

            actual="$(lipo -archs "$stage/TokenBar.app/Contents/MacOS/TokenBar")"
            echo "$arch image: $actual"
            [ "$actual" = "$arch" ]

            ln -s /Applications "$stage/Applications"
            hdiutil create -volname "TokenBar" -srcfolder "$stage" -ov -format UDZO \
              "dist/tokenbar-${TAG}-macos-${arch}.dmg"
          done
          ls -l dist

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v7
        with:
          name: tokenbar-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  ios:
    name: Build iOS (unsigned IPA)
    needs: version
    runs-on: macos-latest
    timeout-minutes: 50
    # No signing secrets here. The IPA is NOT signed: it cannot be installed
    # directly, only re-signed and sideloaded (AltStore, Sideloadly, ...) with
    # the user's own Apple ID.

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (release, no code signing)
        env:
          BUILD_NAME: ${{ needs.version.outputs.name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: flutter build ios --release --no-codesign --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Package the unsigned IPA
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          app="build/ios/iphoneos/Runner.app"
          test -d "$app"
          mkdir -p dist stage/Payload
          cp -R "$app" stage/Payload/
          (cd stage && zip -qry "../dist/tokenbar-${TAG}-ios-unsigned.ipa" Payload)
          ls -l dist

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v7
        with:
          name: tokenbar-ios
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Create draft GitHub Release
    needs: [version, android, windows, linux, macos, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No signing secrets here: this job only uploads the already built files.
    permissions:
      contents: write # create the draft release

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: tokenbar-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist
          cat dist/SHA256SUMS.txt

      - name: Create the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          # Pre-release when the version has a suffix such as -beta.1.
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi

          cat > notes.md <<EOF
          ### Downloads

          | Platform | File |
          | --- | --- |
          | Windows 10/11 (x64) | \`tokenbar-${TAG}-windows-x64-setup.exe\` - installer |
          | Windows 11 on ARM (arm64) | \`tokenbar-${TAG}-windows-arm64-setup.exe\` - installer |
          | Android 64-bit (most phones) | \`tokenbar-${TAG}-android-arm64-v8a.apk\` |
          | Android 32-bit ARM | \`tokenbar-${TAG}-android-armeabi-v7a.apk\` |
          | Android x86_64 (emulator) | \`tokenbar-${TAG}-android-x86_64.apk\` |
          | macOS 12+ (Apple Silicon: M1 and later) | \`tokenbar-${TAG}-macos-arm64.dmg\` |
          | macOS 12+ (Intel) | \`tokenbar-${TAG}-macos-x86_64.dmg\` |
          | Linux x64 | \`tokenbar-${TAG}-linux-x64.tar.gz\` - extract and run \`token_bar\` |
          | Linux ARM64 | \`tokenbar-${TAG}-linux-arm64.tar.gz\` - extract and run \`token_bar\` |
          | iOS 15+ | \`tokenbar-${TAG}-ios-unsigned.ipa\` - **unsigned**, sideload only |

          Verify a download with \`SHA256SUMS.txt\`. Android APKs are signed with the
          TokenBar release key (certificate SHA-256 \`${EXPECTED_CERT_SHA256}\`).

          ### Platform notes

          - **Windows** installers are not code-signed: SmartScreen may warn; choose
            *More info > Run anyway*. The installer is per-user by default (no admin rights).
          - **macOS**: if the first launch is blocked, right-click the app in
            Applications and choose *Open*, or run
            \`xattr -dr com.apple.quarantine /Applications/TokenBar.app\`.
          - **iOS** has no Apple signature. It cannot be installed as is: re-sign and
            sideload it with your own Apple ID (AltStore, Sideloadly, ...).
          - **Linux (x64 and ARM64), iOS and Windows on ARM builds are built by CI but
            have not been tested on real devices yet.** Please report problems in the issue tracker.
          EOF

          # Always a DRAFT: it is not public until you publish it by hand.
          # It fails (and overwrites nothing) if a release for $TAG exists.
          # --target is ignored when the tag already exists (tag-push case);
          # for a manual run the tag is created on that commit at publish time.
          gh release create "$TAG" dist/* \
            --draft \
            --title "TokenBar $TAG" \
            --notes-file notes.md \
            --generate-notes \
            --target "$TARGET_SHA" \
            "${prerelease[@]}"
