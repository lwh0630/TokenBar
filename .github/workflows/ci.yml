name: CI

# Runs on every push / pull request to main, and can be started by hand from
# the "Actions" tab. It only checks and builds the project: there is no release
# signing and no GitHub Release step (see release.yml for that).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the jobs only need to read the repository contents.
permissions:
  contents: read

# A newer run for the same branch / PR cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep these in sync with release.yml and AGENTS.md.
  #   Flutter 3.47.7 ships Dart 3.13.5, which satisfies pubspec.yaml (sdk: ^3.13.5).
  #   JDK 17 matches the Java 17 source/target in android/app/build.gradle.kts.
  FLUTTER_VERSION: "3.47.7"
  # Commit of the Flutter 3.47.7 tag; used to build the Windows arm64 SDK from source.
  FLUTTER_COMMIT: "abaf9c523780a608bd46686fd5e53740a07077f8"
  JAVA_VERSION: "17"

jobs:
  check:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        # Third-party action: pinned to a full commit SHA (tag v2.23.0).
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show tool versions
        run: flutter --version

      - name: Get dependencies (whole workspace)
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test packages

      - name: Analyze app
        run: flutter analyze

      - name: Test app
        run: flutter test

      - name: Analyze and test tokenbar_core
        working-directory: packages/tokenbar_core
        run: |
          dart analyze
          dart test

      - name: Test tokenbar_server
        working-directory: packages/tokenbar_server
        run: |
          dart analyze
          dart test

      - name: Build web
        run: flutter build web --release

  android:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: tokenbar-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Flutter publishes no arm64 Windows SDK archive, so on the ARM runner the
      # tagged source is cloned; its first run downloads the arm64 Dart SDK and the
      # tool then builds a native arm64 app.
      - name: Set up Flutter ${{ env.FLUTTER_VERSION }} (arm64, from source)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --depth 1 --branch $env:FLUTTER_VERSION --single-branch https://github.com/flutter/flutter.git $sdk
          $sha = git -C $sdk rev-parse HEAD
          if ($sha -ne $env:FLUTTER_COMMIT) { throw "Flutter $env:FLUTTER_VERSION resolved to $sha, expected $env:FLUTTER_COMMIT" }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $sdk 'bin')

      - name: Show the Flutter host
        shell: pwsh
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      # Verifies the exe's machine type, builds the Inno Setup installer and
      # smoke-tests a silent install and uninstall.
      - name: Build and test the installer
        env:
          ARCH: ${{ matrix.arch }}
        shell: pwsh
        run: |
          ./tool/build_windows_installer.ps1 -Arch $env:ARCH -Version 0.0.0-ci `
            -OutputName "tokenbar-ci-windows-$env:ARCH-setup" -OutputDir dist

  linux:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            # tray_manager 0.5.x treats new Ayatana deprecations as errors on 26.04.
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system packages
        # GTK for the shell, libsecret for flutter_secure_storage, appindicator for the tray.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libayatana-appindicator3-dev

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Flutter publishes no arm64 Linux SDK archive, so on the ARM runner the
      # tagged source is cloned; its first run downloads the arm64 Dart SDK.
      - name: Set up Flutter ${{ env.FLUTTER_VERSION }} (arm64, from source)
        if: matrix.arch == 'arm64'
        run: |
          sdk="$RUNNER_TEMP/flutter"
          git clone --depth 1 --branch "$FLUTTER_VERSION" --single-branch https://github.com/flutter/flutter.git "$sdk"
          sha="$(git -C "$sdk" rev-parse HEAD)"
          if [ "$sha" != "$FLUTTER_COMMIT" ]; then
            echo "::error::Flutter $FLUTTER_VERSION resolved to $sha, expected $FLUTTER_COMMIT"
            exit 1
          fi
          echo "$sdk/bin" >> "$GITHUB_PATH"

      - name: Show the Flutter host
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Check the target architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          kind="$(file -b "build/linux/$ARCH/release/bundle/token_bar")"
          echo "$kind"
          case "$ARCH" in
            x64)   grep -q 'x86-64' <<< "$kind" ;;
            arm64) grep -q 'ARM aarch64' <<< "$kind" ;;
          esac

  macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS (release, unsigned)
        run: flutter build macos --release

  ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (release, no code signing)
        run: flutter build ios --release --no-codesign
