name: token_bar
description: "TokenBar - cross-platform AI quota monitor (Codex, Claude and more)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

workspace:
  - packages/tokenbar_core
  - packages/tokenbar_server

dependencies:
  flutter:
    sdk: flutter
  tokenbar_core:
    path: packages/tokenbar_core
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^10.3.4
  path_provider: ^2.1.6
  tray_manager: 0.5.0
  window_manager: ^0.5.2
  flutter_local_notifications: ^22.3.2
  launch_at_startup: ^0.5.1
  home_widget: ^0.10.0
  http: ^1.6.0
  flutter_localizations:
    sdk: flutter
  screen_retriever: ^0.2.2
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.3
  intl: ^0.20.3
  flutter_svg: ^2.3.0
  file_picker: ^10.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/tokenbar.png
    - assets/provider_icons/
